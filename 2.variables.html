var secondNum = 15;

// Camel case (Recommended for JS)
var firstNum;
// Pascal case
var FirstNum;
// Snake case
var first_num;

// Rules for naming JS variables
// - Name can contain letters, digits, _ and $
var mySubject1, math$
// - Name cannot start with a digit
var maths;
// - Name can start with an _ or $
var _subjectmarks, $rankInClass;
// - Names are case sentitive
var x, X;
// - Names cannnot be reserved keywords
var varName;

// Q. Which of these variables have valid names and which variables have invalid names? Give reason.
// 1. &alpha1       → Invalid: Variable names cannot start with '&'.
// 2. NUM1           → Valid: Contains only letters and numbers, and starts with a letter.
// 3. DATE-5         → Invalid: '-' is treated as the subtraction operator.
// 4. TotalSum_      → Valid: Underscore '_' is allowed in variable names.
// 5. 12Byby         → Invalid: Variable names cannot start with a number.
// 6. num1           → Valid: Contains only letters and numbers, and starts with a letter.
// 7. super$$        → Invalid: '$' is allowed in JavaScript, but 'super' is a reserved keyword.
// 8. Object         → Valid: 'Object' is not a JavaScript reserved keyword and can be used as a variable name.
// 9. StringNew      → Valid: Contains only letters and starts with a letter.
// 10. $rankInClass  → Valid: '$' is allowed as the first character in a JavaScript variable name.
