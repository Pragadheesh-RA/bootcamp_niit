    case 'a':

    case 'i':
    case 'o':
    case 'u':
    case 'A':
    case 'E':
    case 'I':
    case 'O':
    case 'U':
        console.log("'" + enteredAlphabet + "' is vowel");
        break;

    default:
        console.log("'" + enteredAlphabet + "' is consonant");
}

// Output:
// 'd' is consonant
//
// If:
// enteredAlphabet = 'a'
//
// Output:
// 'a' is vowel
//
// Reason:
// All vowel characters are grouped into the switch cases.
// If the entered character matches any vowel case, it is a vowel.

// Question 3:
// Write a JavaScript program to create menu driven calculator that performs basic
// arithmetic operations (add, subtract, multiply and divide) using switch case.
// The calculator should input two numbers and an operator: +, -, *, / from the user.
// It should perform operation according to the operator entered and must take input
// in given format.

// Answer:

var num1 = Number(prompt("Enter first number:"));
var operator = prompt("Enter operator (+, -, *, /):");
var num2 = Number(prompt("Enter second number:"));

var result;

switch (operator) {
    case '+':
        result = num1 + num2;
        break;

    case '-':
        result = num1 - num2;
        break;

    case '*':
        result = num1 * num2;
        break;

    case '/':
        if (num2 === 0) {
            result = "Cannot divide by zero";
        } else {
            result = num1 / num2;
        }
        break;

    default:
        result = "Invalid operator";
}

console.log("Result = " + result);

// Example:
// Input:
// num1 = 20
// operator = +
// num2 = 10
//
// Output:
// Result = 30
//
// Reason:
// The switch statement checks the operator.
// Based on the operator, the corresponding arithmetic operation is performed.
// The division operation also checks whether the second number is zero.

// Question 5:
// Write a JavaScript program to input electricity unit charge and calculate the total
// electricity bill according to the given condition:
// For first 50 units Rs. 0.50/unit
// For next 100 units Rs. 0.75/unit
// For next 100 units Rs. 1.20/unit
// For unit above 250 Rs. 1.50/unit
// An additional surcharge of 20% is added to the bill.
// For example, input: 20 units then bill is Rs10

// Answer:

var units = Number(prompt("Enter electricity units:"));

var bill = 0;

if (units <= 50) {

    bill = units * 0.50;

} else if (units <= 150) {

    bill = (50 * 0.50) +
           ((units - 50) * 0.75);

} else if (units <= 250) {

    bill = (50 * 0.50) +
           (100 * 0.75) +
           ((units - 150) * 1.20);

} else {

    bill = (50 * 0.50) +
           (100 * 0.75) +
           (100 * 1.20) +
           ((units - 250) * 1.50);
}

var surcharge = bill * 0.20;
var totalBill = bill + surcharge;

console.log("Electricity Bill = Rs." + bill);
console.log("Surcharge = Rs." + surcharge);
console.log("Total Electricity Bill = Rs." + totalBill);

// Example:
// Input:
// 20
//
// Calculation:
// 20 × 0.50 = 10
//
// Basic Bill = Rs.10
// Surcharge = 10 × 20% = Rs.2
// Total Bill = Rs.12
//
// Note:
// Since the question says an additional 20% surcharge is added to the bill,
// the final bill for 20 units is Rs.12.
//
// Reason:
// First, the basic electricity charge is calculated according to the unit slab.
// Then 20% of the basic bill is calculated as the surcharge.
// Finally, the surcharge is added to the basic bill.
