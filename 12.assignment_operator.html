// Answer the following questions WITHOUT executing the code in Codepen.
// Also, explain why do you think your answer is correct.

// Q1. With x = 0, which of the following statements will produce a value of 1?
// a) x++;
// b) x = x + 1;
// c) x += 1;

// Answer:
// a) x++        → Value produced: 0, but x becomes 1
// b) x = x + 1  → Value produced: 1
// c) x += 1     → Value produced: 1
//
// Correct answer: b) and c)
//
// Reason:
// x++ is the post-increment operator. It returns the current value (0) first
// and then increases x to 1.
// x = x + 1 and x += 1 increase x from 0 to 1 and produce the value 1.


// Q2. With x = 1, which of the following statements will produce a value of 0?
// a) x--;
// b) x = x - 1;
// c) x -= 1;

// Answer:
// a) x--        → Value produced: 1, but x becomes 0
// b) x = x - 1  → Value produced: 0
// c) x -= 1     → Value produced: 0
//
// Correct answer: b) and c)
//
// Reason:
// x-- is the post-decrement operator. It returns the current value (1) first
// and then decreases x to 0.
// x = x - 1 and x -= 1 decrease x from 1 to 0 and produce the value 0.


// Q3. What will be the result of following statement?
// var num = 100;
// num += 5 * 10 / 2;

// Answer: 125
//
// Reason:
// Multiplication and division are performed before addition.
// 5 * 10 = 50
// 50 / 2 = 25
// num += 25 means num = num + 25
// num = 100 + 25 = 125


// Q4. What will be the result of following statement?
// var num = 100;
// num *= 2 * 10 / 5;

// Answer: 400
//
// Reason:
// Multiplication and division are performed first.
// 2 * 10 = 20
// 20 / 5 = 4
// num *= 4 means num = num * 4
// num = 100 * 4 = 400

// 2 * 8 = 16
//
// Then subtraction:
// 16 - 15 = 1
//
// num /= 1 means:
// num = 100 / 1
//
// Therefore, num = 100.
