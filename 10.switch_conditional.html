// Answer the following questions and run the code in Codepen.
// Q1. Write a program to print the number of days in a month using a switch case.
// Change the value of monthNumber and check if your code works fine.
// var monthNumber = 3;
// Example:
// monthNumber = 3
// Output:
// Month = March
// Total number of days = 31

var monthNumber = 3;

switch (monthNumber) {
    case 1:
        console.log("Month = January");
        console.log("Total number of days = 31");
        break;

    case 2:
        console.log("Month = February");
        console.log("Total number of days = 28");
        break;

    case 3:
        console.log("Month = March");
        console.log("Total number of days = 31");
        break;

    case 4:
        console.log("Month = April");
        console.log("Total number of days = 30");
        break;

    case 5:
        console.log("Month = May");
        console.log("Total number of days = 31");
        break;

    case 6:
        console.log("Month = June");
        console.log("Total number of days = 30");
        break;

    case 7:
        console.log("Month = July");
        console.log("Total number of days = 31");
        break;

    case 8:
        console.log("Month = August");
        console.log("Total number of days = 31");
        break;

    case 9:
        console.log("Month = September");
        console.log("Total number of days = 30");
        break;

    case 10:
        console.log("Month = October");
        console.log("Total number of days = 31");
        break;

    case 11:
        console.log("Month = November");
        console.log("Total number of days = 30");
        break;

    case 12:
        console.log("Month = December");
        console.log("Total number of days = 31");
        break;

    default:
        console.log("Invalid month number");
}

// Output:
// Month = March
// Total number of days = 31
//
// Reason:
// The switch statement compares monthNumber with each case.
// When monthNumber is 3, case 3 is executed and March has 31 days.


// Q2. Write a program to check vowel or consonant using switch case.
// Change the value of enteredAlphabet and check if your code works fine.
// var enteredAlphabet = 'd'
// Example:
// enteredAlphabet: c
// Output: 'c' is consonant

var enteredAlphabet = 'd';

switch (enteredAlphabet.toLowerCase()) {
    case 'a':
    case 'e':
    case 'i':
    case 'o':
    case 'u':
        console.log("'" + enteredAlphabet + "' is a vowel");
        break;

    default:
        console.log("'" + enteredAlphabet + "' is consonant");
}

// Output:
// 'd' is consonant
//
// Reason:
// The switch checks whether the entered alphabet matches any of the five vowels.
// If it matches a, e, i, o, or u, it is a vowel. Otherwise, it is considered a consonant.


// Q3. Write a program to check even or odd number using switch case.
// Change the value of enteredNumber and check if your code works fine.
// var enteredNumber = 41
// Example:
// enteredNumber: 41
// Output: 41 is an odd number

var enteredNumber = 41;

switch (enteredNumber % 2) {
    case 0:
        console.log(enteredNumber + " is an even number");
        break;

    case 1:
    case -1:
        console.log(enteredNumber + " is an odd number");
        break;

    default:
        console.log("Invalid number");
}

// Output:
// 41 is an odd number
//
// Reason:
// The modulus (%) operator gives the remainder after division by 2.
// If the remainder is 0, the number is even.
// If the remainder is 1 or -1, the number is odd.
