// Q1. Write a JavaScript program to find the longest string from a given array.
// Sample Data
// Input:
// Array: ['asdf', 'sd', 'something','right','position']
// Output:
// "Longest String in array : something"

// Answer:

var arr = ['asdf', 'sd', 'something', 'right', 'position'];

var longestString = arr[0];

for (var i = 1; i < arr.length; i++) {
    if (arr[i].length > longestString.length) {
        longestString = arr[i];
    }
}

console.log("Longest String in array : " + longestString);

// Output:
// Longest String in array : something
//
// Reason:
// The loop compares the length of each string with the current longest string.
// If a string has a greater length, it becomes the new longest string.


// Q2. Write a JavaScript program to remove '0', false, undefined, null, NaN, '' from given array.
// Sample Data
// Input:
// Array: [NaN, 0, 15, false, -22, '',undefined, 47, null,94]
// Output:
// [15, -22, 47, 94]

// Answer:

var arr = [NaN, 0, 15, false, -22, '', undefined, 47, null, 94];

var result = arr.filter(function(value) {
    return Boolean(value);
});

console.log(result);

// Output:
// [15, -22, 47, 94]
//
// Reason:
// Boolean(value) converts each element into true or false.
// 0, false, undefined, null, NaN and '' are falsy values,
// so filter() removes them from the array.
// The remaining truthy values are kept.


// Q3. Write a JavaScript code to divide a given array of positive integers into two parts.
// First element goes to first part, second element goes to second part,
// and third element goes to first part and so on.
// Now compute the sum of two parts and store into an array of size two.
// Sample Data
// Input:
// Array: [1, 3, 6, 2, 5, 10]
// Output:
// [12, 15]

// Answer:

var arr = [1, 3, 6, 2, 5, 10];

var sum1 = 0;
var sum2 = 0;

for (var i = 0; i < arr.length; i++) {
    if (i % 2 === 0) {
        sum1 += arr[i];
    } else {
        sum2 += arr[i];
    }
}

var result = [sum1, sum2];

console.log(result);

// Output:
// [12, 15]
//
// Reason:
// Elements at even indexes (0, 2, 4) go into the first part:
// 1 + 6 + 5 = 12
//
// Elements at odd indexes (1, 3, 5) go into the second part:
// 3 + 2 + 10 = 15
//
// Therefore, the result is [12, 15].


// Q4. Write a JavaScript program to check whether there is at least one element
// which occurs in two given sorted arrays of integers.
// Sample Data
// Input 1:
// arr1 = [1,2,3];
// arr2 = [3,4,5];
// Output 1:
// True
//
// Input 2:
// arr1 = [1,2,3];
// arr2 = [4,5,6];
// Output 2:
// False

// Answer:

function hasCommonElement(arr1, arr2) {
    var i = 0;
    var j = 0;

    while (i < arr1.length && j < arr2.length) {
        if (arr1[i] === arr2[j]) {
            return true;
        } else if (arr1[i] < arr2[j]) {
            i++;
        } else {
            j++;
        }
    }

    return false;
}

var arr1 = [1, 2, 3];
var arr2 = [3, 4, 5];

console.log(hasCommonElement(arr1, arr2));

// Output:
// true
//
// Reason:
// Both arrays are sorted, so we compare their elements using two pointers.
// When the elements are equal, a common element exists and the function returns true.
// If no common element is found, it returns false.


// Input 2:

var arr1 = [1, 2, 3];
var arr2 = [4, 5, 6];

console.log(hasCommonElement(arr1, arr2));

// Output:
// false


// Q5. Write a JavaScript function to find the difference of two arrays.
// Sample Data
// Input:
// arr1 = [1, 2, 3];
// arr2 = [100, 2, 1, 10]
// Output:
// [3, 100, 10]

// Answer:

var arr1 = [1, 2, 3];
var arr2 = [100, 2, 1, 10];

function arrayDifference(arr1, arr2) {
    var result = [];

    for (var i = 0; i < arr1.length; i++) {
        if (!arr2.includes(arr1[i])) {
            result.push(arr1[i]);
        }
    }

    for (var i = 0; i < arr2.length; i++) {
        if (!arr1.includes(arr2[i])) {
            result.push(arr2[i]);
        }
    }

    return result;
}

console.log(arrayDifference(arr1, arr2));

// Output:
// [3, 100, 10]
//
// Reason:
// The function checks which elements exist in only one of the two arrays.
// 3 exists only in arr1.
// 100 and 10 exist only in arr2.
// 1 and 2 are present in both arrays, so they are excluded.
//
// Therefore, the difference is [3, 100, 10].
