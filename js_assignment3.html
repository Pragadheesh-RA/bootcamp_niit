// Question 1:
// Write a program to search if a number exists in an array. If the number exists then return the position.
// If it exists multiple time then return an array with all the positions.
// If the number doesn't exist then return -1;
// For example,
// Input: [1, 2, 3, 4, 5, 1, 3] and Search Elem: 4
// Output: 3
// Input: [1, 2, 3, 4, 5, 1, 3] and Search Elem: 1
// Output: [0, 5]
// Input: [1, 2, 3, 4, 5, 1, 3] and Search Elem: 7
// Output: -1

// Answer:

function searchElement(arr, searchElem) {
    var positions = [];

    for (var i = 0; i < arr.length; i++) {
        if (arr[i] === searchElem) {
            positions.push(i);
        }
    }

    if (positions.length === 0) {
        return -1;
    } else if (positions.length === 1) {
        return positions[0];
    } else {
        return positions;
    }
}

var arr = [1, 2, 3, 4, 5, 1, 3];

console.log(searchElement(arr, 4));
console.log(searchElement(arr, 1));
console.log(searchElement(arr, 7));

// Output:
// 3
// [0, 5]
// -1
//
// Reason:
// The loop checks every element of the array.
// Whenever the search element is found, its index is stored in positions.
// If there are no positions, -1 is returned.
// If there is only one position, that position is returned directly.
// If there are multiple positions, the complete positions array is returned.

// Question 3:
// Write a JavaScript program to sort an array in ascending order
// For example,
// Input: [3, 2, 1, 4, 5, 45]
// Output: [1, 2, 3, 4, 5, 45]

// Answer:

var arr = [3, 2, 1, 4, 5, 45];

for (var i = 0; i < arr.length - 1; i++) {
    for (var j = 0; j < arr.length - i - 1; j++) {

        if (arr[j] > arr[j + 1]) {
            var temp = arr[j];
            arr[j] = arr[j + 1];
            arr[j + 1] = temp;
        }
    }
}

console.log(arr);

// Output:
// [1, 2, 3, 4, 5, 45]
//
// Reason:
// This uses the Bubble Sort technique.
// Two adjacent elements are compared.
// If the first element is greater than the second element,
// their positions are exchanged.
// After every pass, the largest remaining element moves toward the end.

// Question 4:
// Write a JavaScript program to check if two strings are anagrams.
// Anagram strings are such two strings which can be rearranged to create one another.
// For example,
// Input: LISTEN and SILENT
// Output: True
// Input: HELLO and JELLO
// Output: False

// Answer:

function areAnagrams(str1, str2) {

    if (str1.length !== str2.length) {
        return false;
    }

    var count = {};

    for (var i = 0; i < str1.length; i++) {
        var char = str1[i].toLowerCase();

        if (count[char] === undefined) {
            count[char] = 1;
        } else {
            count[char]++;
        }
    }

    for (var i = 0; i < str2.length; i++) {
        var char = str2[i].toLowerCase();

        if (count[char] === undefined) {
            return false;
        }

        count[char]--;

        if (count[char] < 0) {
            return false;
        }
    }

    return true;
}

console.log(areAnagrams("LISTEN", "SILENT"));
console.log(areAnagrams("HELLO", "JELLO"));

// Output:
// true
// false
//
// Reason:
// Anagrams must contain exactly the same characters with the same frequency.
// LISTEN and SILENT both contain:
// L, I, S, T, E, N
//
// Therefore, they are anagrams.
//
// HELLO and JELLO contain different characters:
// H and J
//
// Therefore, they are not anagrams.

// Question 5:
// Write a JavaScript program to reverse a string without using inbuilt methods.
// For example,
// Input: Hello
// Output: olleH

// Answer:

var str = "Hello";
var reversed = "";

for (var i = str.length - 1; i >= 0; i--) {
    reversed += str[i];
}

console.log(reversed);

// Output:
// olleH
//
// Reason:
// The loop starts from the last character of the string
// and moves toward the first character.
// Each character is added to the reversed string.
//
// H e l l o
// 0 1 2 3 4
//
// Characters are accessed in reverse order:
// o → l → l → e → H
//
// Therefore, the final output is:
// olleH

console.log("Q5 END =====================");
