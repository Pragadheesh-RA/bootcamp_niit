// How do you find duplicate numbers in an array if it contains multiple duplicates?

var mArr = [10, 10, 20, 20, 20, 30, 30, 30, 30, 40, 50, 60, 70];

var result = {};

for (var i = 0; i < mArr.length; i++) {
    if (result[mArr[i]] !== undefined) {
        result[mArr[i]] = result[mArr[i]] + 1;
    } else {
        if (mArr.indexOf(mArr[i], i + 1) >= 0) {
            result[mArr[i]] = 1;
        }
    }
}

console.log(result);

// Output:
// {
//     10: 1,
//     20: 2,
//     30: 3
// }
//
// Reason:
// result is used as an object to keep track of duplicate numbers.
// When a number is encountered for the first time, indexOf() checks whether
// the same number occurs again later in the array.
//
// If it occurs again, it is added to result with a count of 1.
// Every subsequent occurrence increases its count by 1.
//
// Therefore:
// 10 occurs 2 times → duplicate count = 1
// 20 occurs 3 times → duplicate count = 2
// 30 occurs 4 times → duplicate count = 3
//
// 40, 50, 60 and 70 occur only once, so they are not included.
//
// If you want the actual frequency of each duplicate number instead of
// "number of extra occurrences", you can use:

var frequency = {};

for (var i = 0; i < mArr.length; i++) {
    if (frequency[mArr[i]] === undefined) {
        frequency[mArr[i]] = 1;
    } else {
        frequency[mArr[i]]++;
    }
}
