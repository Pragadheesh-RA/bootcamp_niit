// Q2. Write some code to check which number is greatest. Change values and see if your code works or not.
// var num1=5, num2=8, num3=20;

var num1 = 5, num2 = 8, num3 = 20;

if (num1 >= num2 && num1 >= num3) {
    console.log(num1 + " is the greatest number.");
} else if (num2 >= num1 && num2 >= num3) {
    console.log(num2 + " is the greatest number.");
} else {
    console.log(num3 + " is the greatest number.");
}

// Output:
// 20 is the greatest number.
//
// Reason:
// The if-else conditions compare each number with the other two numbers.
// The number that is greater than or equal to both is printed as the greatest.

var enteredMarks = 77;

if (enteredMarks < 25) {
    console.log("Grade F");
} else if (enteredMarks < 45) {
    console.log("Grade E");
} else if (enteredMarks < 50) {
    console.log("Grade D");
} else if (enteredMarks < 60) {
    console.log("Grade C");
} else if (enteredMarks <= 80) {
    console.log("Grade B");
} else {
    console.log("Grade A");
}

// Output:
// Grade B
//
// Reason:
// The conditions are checked from the lowest mark range to the highest.
// Since 77 falls between 60 and 80, the corresponding grade is B.

var unitCost = 100;

var totalCost = numberOfItemPurchased * unitCost;

if (totalCost > 1000) {
    var discount = totalCost * 0.10;
    totalCost = totalCost - discount;
    console.log("10% discount applied.");
}

console.log("Total cost: " + totalCost);

//
// Reason:
// 8 items × 100 = 800.
// Since 800 is not more than 1000, no discount is applied.
